version: "2"

# 方針:
#   リンタは「今回のリファクタで実際に見つかった不具合の型」に効くものを選んでいる。
#   既存コードには未修正の指摘が残っているため、段階的に導入する。
#   フェーズが進んで該当ファイルを作り直したら exclusions の項目を削ること。

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # err のシャドーイングを検出する。
    # copy.go の glob エラーチェックが死にコードになっていた不具合と、
    # googleDrive.go の getClient が初回必ず401になる不具合の両方がこれで出る。
    - govet
    # builtin の名前を隠す宣言を検出する。func copy(...) が該当。
    - predeclared
    # HTTP レスポンスボディの閉じ忘れ。
    - bodyclose
    # context を受け取れるのに使っていない箇所。
    - noctx
    # 使われない引数・不要な型変換。
    - unparam
    - unconvert
    # 変数シャドーイング全般。
    - copyloopvar
    # エラーの比較に == を使っている箇所（errors.Is を使うべき箇所）。
    - errorlint

  settings:
    govet:
      enable:
        - shadow
    errcheck:
      # Close() や Fprintf の戻り値まで全て求めると既存コードが埋まるため、
      # 明示的に無視した式（_ = f()）は許容する。
      check-blank: false
      check-type-assertions: true
    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # ---- 段階導入のための一時的な除外 ----
      # 以下は計画の各フェーズで作り直す予定のファイル。
      # 作り直しが済んだら、対応する行を削除すること。

      # P7 で全面書き直し（Files.Get の応答は File.Data として
      # 呼び出し側に渡すため bodyclose は誤検出）
      - path: googleDrive\.go
        linters: [errcheck, unparam, errorlint, noctx, bodyclose]

      # P7 で filetransfer ベースに刷新
      - path: dropbox\.go
        linters: [errcheck, govet, unparam, errorlint, noctx]

      # P4 で transfer/ パッケージへ移植
      - path: internal/cli/copy\.go
        linters: [errcheck, unparam]

      # P9 で書き直し（readline 差し替え・ドライブレター判定のヘルパ化）
      - path: internal/cli/shell\.go
        linters: [errcheck, govet, unparam, staticcheck, ineffassign]

      # P2 で $HOME/hbg/ 集約とともに書き直し
      - path: internal/cli/cmd\.go
        linters: [errcheck, unparam]

      # P3 で新インターフェースへ移行
      - path: localfilesystem\.go
        linters: [errcheck, unparam]

      - path: internal/cli/(list|remove)\.go
        linters: [errcheck, unparam]

      # テストコードでは戻り値の無視やシャドーイングを許容する
      - path: _test\.go
        linters: [errcheck, unparam, govet]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
